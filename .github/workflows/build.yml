name: Build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional surefire test selector, e.g. JsonReaderTest (empty = full suite)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
      - name: Build with Maven
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            mvn --batch-mode --update-snapshots verify -Dtest="${{ inputs.test-filter }}" -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false
          else
            mvn --batch-mode --update-snapshots verify
          fi
      - name: List skipped tests with reasons
        if: always()
        run: |
          grep -h -A1 '<testcase' */target/surefire-reports/TEST-*.xml | grep -B1 '<skipped' || echo "No skipped tests"
      - name: Upload gson jar
        uses: actions/upload-artifact@v4
        with:
          name: gson-jar
          path: gson/target/gson-*.jar
          if-no-files-found: error
